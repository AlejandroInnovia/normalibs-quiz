<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quiz Apunta a ti de Normalibs®: encuentre su presentación y el Plan Paciente 2+1.">
<link rel="icon" href="assets/petri.webp">
<title>Quiz Normalibs Apunta a ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap">
<style>
/* Layout: one phone-width column in the Normalibs landing language — offwhite or deep navy ground, the real petri-dish culture art as the hero object, teal pill CTAs, 28–32px cards. */
:root{
  --bg:#F7F5F1; --card:#FFFFFF; --ink:#1D1D1B; --head:#0A3A47; --muted:#5B6E73; --line:#E6E3DD;
  --accent:#0B7880; --accent-ink:#0A7A83; --aqua:#7EC3CF; --soft:#E4F1F2;
  --band:#0A3A47; --band-ink:#FFFFFF; --band-muted:rgba(255,255,255,.8);
  --warn:#9B3B2E; --warn-soft:#F6E7E3; --glass:rgba(247,245,241,.9);
  --pres:#4A3CA0; --pres-ink:#4A3CA0; --pres-on:#FFFFFF; --pres-hot:#A99CF0; --pres-halo:0 0 2px #fff,0 0 10px rgba(255,255,255,.95),0 0 22px rgba(255,255,255,.75);
  --font:"Montserrat",Arial,"Helvetica Neue",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
[data-pres="sobres"]{--pres:#E09A55;--pres-ink:#C07A38;--pres-on:#0A3A47;--pres-hot:#E09A55;--pres-halo:0 0 2px #fff,0 0 10px rgba(255,255,255,.95),0 0 22px rgba(255,255,255,.75)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06191F; --card:#0C2A33; --ink:#E9F1F1; --head:#F4F8F8; --muted:#9DB6BB; --line:#1C4350;
  --accent:#0B7880; --accent-ink:#5CC8D0; --soft:#0F3A45;
  --band:#0B2C36; --warn:#F0A493; --warn-soft:#3A2420; --glass:rgba(6,25,31,.88);
  --pres-ink:#9F8FEA; color-scheme:dark}
  :root:not([data-theme="light"]) [data-pres="sobres"]{--pres-ink:#E09A55}}
:root[data-theme="dark"]{
  --bg:#06191F; --card:#0C2A33; --ink:#E9F1F1; --head:#F4F8F8; --muted:#9DB6BB; --line:#1C4350;
  --accent:#0B7880; --accent-ink:#5CC8D0; --soft:#0F3A45;
  --band:#0B2C36; --warn:#F0A493; --warn-soft:#3A2420; --glass:rgba(6,25,31,.88);
  --pres-ink:#9F8FEA; color-scheme:dark}
:root[data-theme="dark"] [data-pres="sobres"]{--pres-ink:#E09A55}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:20px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px;border-radius:12px}
sup{font-size:.6em;line-height:0}
em{font-style:italic}

/* logo swap per theme */
.lg-w{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-d{display:none}:root:not([data-theme="light"]) .lg-w{display:block}}
:root[data-theme="dark"] .lg-d{display:none}:root[data-theme="dark"] .lg-w{display:block}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:-20px;padding:10px 20px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:8px;min-height:40px}
.iconbtn{border:0;background:transparent;display:grid;place-items:center;width:44px;height:44px;color:var(--head);cursor:pointer;border-radius:50%;flex:none;transition:background .2s}
.iconbtn:hover{background:var(--soft)}
.back{margin-left:-8px}
.back[hidden]{display:none}
.brand img{height:30px;width:auto;max-width:100%}
.steplabel{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.steplabel b{color:var(--head);font-weight:800}
.bar{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px;transform-origin:left center;transform:scaleX(0);transition:transform .9s cubic-bezier(.22,1,.36,1);will-change:transform}
.theme .sun{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon{display:none}}
:root[data-theme="dark"] .theme .sun{display:block}:root[data-theme="dark"] .theme .moon{display:none}

main{flex:1;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:22px;padding-block:24px 28px;animation:inF .5s var(--ease) both}
main[data-dir="back"] .screen{animation-name:inB}
.screen.leaving{animation:outF .16s ease-in both}
main[data-dir="back"] .screen.leaving{animation-name:outB}
@keyframes inF{from{opacity:.001;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:.001;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes outF{to{opacity:0;transform:translateX(-22px)}}
@keyframes outB{to{opacity:0;transform:translateX(22px)}}
@keyframes up{from{opacity:.001;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:.001;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.97);opacity:.45}50%{transform:scale(1.04);opacity:.9}}
@keyframes ripple{from{transform:scale(.9);opacity:.7}to{transform:scale(1.22);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink)}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--head)}
h1{font-size:clamp(28px,8vw,34px);line-height:1.12;font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(25px,7vw,30px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
h3{font-size:18px;font-weight:800;line-height:1.25}
.sub{margin:0;color:var(--muted);font-size:15.5px}
h1.qt{font-size:clamp(25px,7vw,30px);line-height:1.15}

/* Buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:14px 26px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:transform .15s var(--ease),box-shadow .25s,opacity .2s}
.btn:hover{box-shadow:0 14px 28px -16px rgba(14,140,150,.8);transform:translateY(-1px)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:transparent;color:var(--head);border:1.5px solid var(--head)}
.btn.light{background:#fff;color:#0A3A47}
.btn.sq{border-radius:16px}
.btn.shine::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-18deg);animation:shine 3.6s ease-in-out 3 1.2s}
@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
.link{border:0;background:none;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 12px;min-height:44px;align-self:center}

/* Intro */
.intro{gap:18px;text-align:center;align-items:center;padding-top:58px}
.dish{position:relative;width:min(78vw,320px);aspect-ratio:1;max-width:100%;margin-block:4px 6px;animation:pop .9s var(--spring) both}
.dish img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:spin 80s linear infinite;filter:drop-shadow(0 26px 34px rgba(10,58,71,.28))}
.dish::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--aqua);opacity:.5;animation:breathe 4.5s ease-in-out 3}
.dish::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--aqua);animation:ripple 4.5s ease-out 3 1.5s}
.dish .scrim{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(closest-side,rgba(10,58,71,.62),rgba(10,58,71,.28) 60%,rgba(10,58,71,0));pointer-events:none}
.dish .label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 12%;text-align:center;color:#fff}
.dish .label img{position:static;animation:none;width:100%;height:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}
.intro>*:not(.dish){animation:up .7s var(--ease) both}
.intro>.eyebrow{animation-delay:.2s}.intro>h1{animation-delay:.3s}.intro>.sub{animation-delay:.4s}.intro>.chips{animation-delay:.5s}.intro>.btn{animation-delay:.6s}.intro>.note{animation-delay:.7s}
.intro .sub{max-width:34ch}
.hero-cta{display:flex;flex-direction:column;align-items:center;gap:14px;align-self:stretch}
.hlink{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--head);font-weight:700;font-size:15px;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px;transition:gap .2s var(--ease)}
.hlink:hover{gap:12px}
.intro>.hero-cta{animation-delay:.5s}
.dish{position:relative;width:min(78vw,320px);aspect-ratio:1;max-width:100%;margin-block:4px 6px;animation:pop .9s var(--spring) both}
.dish img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:spin 80s linear infinite;filter:drop-shadow(0 26px 34px rgba(10,58,71,.28))}
.dish::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--aqua);opacity:.5;animation:breathe 4.5s ease-in-out 3}
.dish::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--aqua);animation:ripple 4.5s ease-out 3 1.5s}
.dish .scrim{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(closest-side,rgba(10,58,71,.62),rgba(10,58,71,.28) 60%,rgba(10,58,71,0));pointer-events:none}
.dish .label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 12%;text-align:center;color:#fff}
.dish .label img{position:static;animation:none;width:100%;height:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}
.intro>*:not(.dish){animation:up .7s var(--ease) both}
.intro>.eyebrow{animation-delay:.2s}.intro>h1{animation-delay:.3s}.intro>.sub{animation-delay:.4s}.intro>.chips{animation-delay:.5s}.intro>.btn{animation-delay:.6s}.intro>.note{animation-delay:.7s}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips span{font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;background:var(--soft);color:var(--head)}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* Questions */
.qhead{display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.qhead>*{animation:up .55s var(--ease) both}
.qhead>*:nth-child(2){animation-delay:.08s}
.hint{margin:0;color:var(--muted);font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-align:center;padding:15px 22px;min-height:58px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15.5px;line-height:1.3;color:var(--head);transition:border-color .15s,color .2s,transform .1s;animation:pop .45s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + .1s)}
.opt::before{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform .32s var(--ease);z-index:-1}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.985)}
.opt .dot{flex:none;width:0;height:18px;overflow:hidden;display:grid;place-items:center;transition:width .18s}
.opt .dot::after{content:"";width:10px;height:5px;border:2px solid currentColor;border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{border-color:var(--accent);color:#fff}
.opt[aria-checked="true"]::before,.opt[aria-pressed="true"]::before{transform:scaleX(1)}
.opt[aria-checked="true"] .dot,.opt[aria-pressed="true"] .dot{width:16px}
.opt span{min-width:0}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.whoc{position:relative;overflow:hidden;display:block;padding:0;border-radius:26px;border:2px solid transparent;background:var(--card);cursor:pointer;aspect-ratio:4/5;max-width:100%;color:#fff;text-align:left;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s;animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0)*80ms + .12s)}
.whoc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.whoc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,58,71,0) 40%,rgba(10,58,71,.88))}
.whoc .wt{position:absolute;left:14px;right:14px;bottom:14px;z-index:1;display:flex;flex-direction:column;gap:2px}
.whoc b{font-size:16px;font-weight:800;line-height:1.2}
.whoc small{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--aqua)}
.whoc:hover{transform:translateY(-3px);box-shadow:0 20px 34px -22px rgba(10,58,71,.6)}
.whoc:hover img,.whoc[aria-pressed="true"] img{transform:scale(1.05)}
.whoc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.safety{display:flex;gap:10px;align-items:flex-start;background:var(--soft);color:var(--head);border-radius:16px;padding:12px 14px;font-size:13.5px}
.safety svg{flex:none;margin-top:2px}
.dock{position:sticky;bottom:0;margin-top:auto;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 30%)}

/* Loading */
.loading{align-items:center;justify-content:center;text-align:center;gap:22px;min-height:62vh}
.orb{position:relative;width:150px;height:150px;max-width:100%}
.orb img{position:absolute;inset:0;width:100%;height:100%;animation:spin 6s linear infinite}
.orb::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1.5px solid var(--aqua);animation:ripple 1.6s ease-out infinite}

/* Result */
.result{padding-top:8px;gap:0}
.rhero{position:relative;display:flex;justify-content:center;padding-top:44px}
.rhero .dish{width:min(74vw,290px)}
.rhero .dish .label{padding:0 14%;gap:8px}
.rhero .dish .label .pn{font-weight:800;font-size:clamp(26px,7.4vw,32px);line-height:1;color:var(--pres);text-shadow:var(--pres-halo)}
.rhero .dish .label .au{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--pres-on);background:var(--pres);border-radius:99px;padding:5px 12px}
.rhead{display:flex;flex-direction:column;gap:12px;padding:22px 0 6px;text-align:center;align-items:center}
.rhead>*{animation:up .7s var(--ease) both}
.rhead>*:nth-child(1){animation-delay:.45s}.rhead>*:nth-child(2){animation-delay:.55s}.rhead>*:nth-child(3){animation-delay:.65s}.rhead>*:nth-child(4){animation-delay:.75s}
.rbody{display:flex;flex-direction:column;gap:34px;padding-top:22px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center}
.symlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-radius:26px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.symlist li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:14px 18px}
.symlist li+li{border-top:1px solid var(--line)}
.symlist .sk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent-ink)}
.symlist .sk svg{width:18px;height:18px}
.symlist b{display:block;font-size:15px;color:var(--head);line-height:1.3}
.symlist span{font-size:13.5px;color:var(--muted)}
.symnote{margin:0;text-align:center;font-size:14px;color:var(--muted)}
.told{display:flex;flex-direction:column;border-radius:26px;background:var(--card);border:1px solid var(--line);margin:0;overflow:hidden}
.told div{display:flex;flex-direction:column;gap:2px;padding:14px 20px}
.told div+div{border-top:1px solid var(--line)}
.told dt{font-size:12px;color:var(--muted);font-weight:500}
.told dd{margin:0;font-weight:700;font-size:15px;color:var(--head)}
.mdnote{display:flex;gap:12px;align-items:flex-start;background:var(--soft);color:var(--head);border-radius:20px;padding:14px 16px}
.mdnote svg{flex:none;margin-top:2px}
.mdnote p{margin:0;font-size:14px}
.mdnote.warn{background:var(--warn-soft);color:var(--warn)}
.rv{opacity:.001;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}

/* Product card */
.pcard{border-radius:30px;background:var(--card);border:1px solid var(--line);display:grid;grid-template-columns:42% 1fr;gap:16px;padding:16px;align-items:center}
.pcard .pimg{background:#fff;border-radius:20px;overflow:hidden;aspect-ratio:4/5;display:grid;place-items:center;max-width:100%}
.pcard .pimg img{width:100%;height:100%;object-fit:contain}
.pcard .pinfo{display:flex;flex-direction:column;gap:8px;min-width:0}
.ptag{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--pres);color:var(--pres-on)}
.pcard h3{font-size:19px}
.pcard h3 span,.pn-c{color:var(--pres-ink);font-weight:500}
.pcard h3 span,.tier h3 .pn-c{font-weight:700}
.tier.hot .pn-c{color:var(--pres-hot)}
.specs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.specs li{display:flex;gap:8px;font-size:13.5px;color:var(--muted);line-height:1.35}
.specs li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--pres);margin-top:6px}
.constancy{display:flex;gap:14px;align-items:center;background:var(--band);color:var(--band-ink);border-radius:24px;padding:16px 18px}
.constancy .big{font-size:40px;font-weight:800;line-height:1;color:var(--aqua);font-variant-numeric:tabular-nums}
.constancy p{margin:0;font-size:14px;color:var(--band-muted)}
.constancy b{color:#fff}

/* Routine */
.journey{list-style:none;margin:0;padding:22px 18px 6px;background:var(--card);border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column}
.journey li{display:grid;grid-template-columns:40px 1fr;gap:14px;padding-bottom:22px;position:relative}
.journey li:not(:last-child)::before{content:"";position:absolute;left:19.5px;top:42px;bottom:2px;width:1px;background:var(--line)}
.journey .ji{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--head);display:grid;place-items:center;color:var(--head);background:var(--card)}
.journey .ji svg{width:21px;height:21px}
.journey .jt{margin:7px 0 4px;font-size:16px;font-weight:700;color:var(--head);line-height:1.35}
.journey .jt sup{font-size:.55em;color:var(--muted);font-weight:600}
.journey .jb{display:inline-block;vertical-align:1px;margin-right:8px;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:99px;padding:3px 10px;white-space:nowrap}
.journey .jd{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.journey .jstat{margin:2px 0 4px;display:flex;align-items:center;gap:10px}
.journey .jstat b{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.journey .jstat span{font-size:15px;font-weight:700;color:var(--head);line-height:1.2;max-width:12ch}
.journey .jstat sup{font-size:.55em;color:var(--muted)}
.journey li.st .jt{margin-bottom:2px}
.jnote{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:46px 1fr;gap:14px;padding-bottom:20px;position:relative}
.timeline li:not(:last-child)::before{content:"";position:absolute;left:22px;top:46px;bottom:4px;width:2px;background:linear-gradient(var(--accent),var(--line))}

<script>
(function(){

/* Questions. Options: [value, adult label, child label] */
const Q=[
 {id:"who",n:1,t:"¿Para quién es?",h:"Así le recomendamos la presentación indicada.",who:true},
 {id:"q4",n:2,t:"¿En qué momentos lo nota más?",adult:[["comidas","Cuando como fuera de casa"],["trabajo","En el trabajo"],["planes","En viajes o planes sociales"],["estres","En momentos de estrés"]],
   child:[["escuela","En la escuela o el colegio"],["comer","Después de comer"],["paseos","En paseos o actividades"],["nervios","En momentos de nervios"]]},
 {id:"q3",n:3,t:"¿Tiene diagnóstico médico de Síndrome de Intestino Irritable?",k:"¿Su pediatra le diagnosticó Síndrome de Intestino Irritable?",opts:[

const TOTAL=4;
/* Molestia principal derivada de los síntomas marcados (reemplaza la antigua pregunta 2) */
function deriveFocus(){
  const s=A.alarm.filter(x=>x!=="ninguno");
  const g=new Set(s.map(x=>({dolor:"molestias",distension:"hinchazon",gases:"hinchazon",heces:"ritmo",urgencia:"ritmo",estres:"molestias"})[x]));
  A.q1=g.size===1?[...g][0]:"varias";
}
const flow=["intro",...Q.map(q=>q.id),"meet","journey","unlock","loading","result"];
let i=0;const A={alarm:[]};let lead={email:"",unlocked:false};let obs=[];let busy=false;

const $=s=>document.querySelector(s);
const main=$("#main");

  const id=flow[i];const q=Q.find(x=>x.id===id);

  setBar(id);
  $("#app").removeAttribute("data-pres");
}
function prog(id){const q=Q.find(x=>x.id===id);return id==="loading"||id==="result"?1:id==="meet"?.86:id==="journey"?.91:id==="unlock"?.96:(q?(q.n-.5)/TOTAL:0)}

  return question(Q.find(x=>x.id===id));

function go(d){

function question(q){
  if(q.who){
    main.innerHTML=`<section class="screen">
      <div class="qhead"><h1 id="qh" class="qt">${esc(q.t)}</h1><p class="hint">${esc(q.h)}</p></div>
      <div class="who" role="group" aria-labelledby="qh">
        <button type="button" class="whoc" style="--i:0" data-v="yo" aria-pressed="${A.who==="yo"}"><img src="${IMG.woman}" alt="" width="600" height="750"><span class="wt"><small>Adultos</small><b>Para mí</b></span></button>
        <button type="button" class="whoc" style="--i:1" data-v="hijo" aria-pressed="${A.who==="hijo"}"><img src="${IMG.kid}" alt="" width="600" height="750"><span class="wt"><small>Niños</small><b>Para mi hijo o hija</b></span></button>
      </div>
    </section>`;
    main.querySelectorAll(".whoc").forEach(b=>b.addEventListener("click",()=>{
      if(A.who!==b.dataset.v){A.q4=undefined}
      A.who=b.dataset.v;main.querySelectorAll(".whoc").forEach(o=>o.setAttribute("aria-pressed",o===b));setTimeout(()=>go(1),RM()?0:260);
    }));
    return;
  }
  const multi=!!q.multi;const sel=multi?A.alarm:A[q.id];
  main.innerHTML=`<section class="screen">
    <div class="qhead"><h1 id="qh" class="qt">${esc(titleOf(q))}</h1>${q.h?`<p class="hint">${esc(q.h)}</p>`:""}</div>
    <div class="opts" role="group" aria-labelledby="qh">
      ${optsOf(q).map((o,ix)=>`<button type="button" class="opt" style="--i:${ix}" data-v="${o[0]}" ${multi?`role="checkbox" aria-checked="${sel.includes(o[0])}"`:`aria-pressed="${sel===o[0]}"`}><span class="dot" aria-hidden="true"></span><span>${esc(o[1])}</span></button>`).join("")}
    </div>
    ${multi?`<div class="dock"><button class="btn" id="next" type="button" ${A.alarm.length?"":"disabled"}>Continuar</button></div>`:""}
  </section>`;
  main.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.v;
    if(multi){
      let s=A.alarm;
      if(v==="ninguno")s=s.includes("ninguno")?[]:["ninguno"];
      else{s=s.filter(x=>x!=="ninguno");s=s.includes(v)?s.filter(x=>x!==v):[...s,v]}
      A.alarm=s;main.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-checked",s.includes(o.dataset.v)));$("#next").disabled=!s.length;
    }else{
      A[q.id]=v;main.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed",o.dataset.v===v));setTimeout(()=>go(1),RM()?0:260);
    }
  }));
  if(multi)$("#next").addEventListener("click",()=>{deriveFocus();go(1)});
}

      <h3>Normalibs<sup>®</sup> <span class="pn-c">${p.name}</span> · 3 ${p.unit} en 2 pagos</h3>
      <div class="price"><b data-n="${p.fee}" aria-label="${fmt(p.fee)}">${fmt(p.fee)}</b><span>primer pago</span></div>
      <div class="months"><div><b>PRIMER PAGO</b>${fmt(p.fee)}<br>Recibe 1 unidad</div><div><b>SEGUNDO PAGO</b>${fmt(p.fee)}<br>Recibe 2 · 1 de regalo</div></div>
      <ul class="ticks2"><li>Sin intereses ni cargos adicionales</li><li>El segundo pago cuando usted decida</li></ul>
      <a class="btn ghost sq" href="${fraccUrl(pk)}" target="_blank" rel="noopener">Solicitar plan fraccionado<span class="sr"> (se abre en una pestaña nueva)</span></a>
    </article>
    ${lead.unlocked?"":`<button class="tease" type="button" id="toUnlock">${ico("gift")}Desbloquee ${COUPON.pct}% extra en su primer plan</button>`}
    <ul class="benefits rv">
      <li><span class="bi">${ico("pack")}</span><div><b>Desde su primer plan</b><span>Guía digital de bienestar digestivo, recordatorios de toma diaria y comunidad Normalibs<sup>®</sup>.</span></div></li>
      <li><span class="bi">${ico("yoga")}</span><div><b>Al renovar su plan</b><span>Una clase de yoga mensual, cubierta por GoPharma Care.</span></div></li>
      <li><span class="bi">${ico("doc")}</span><div><b>Al cumplir un año</b><span>Cita con nutricionista y cita médica de seguimiento, cubiertas por GoPharma Care.</span></div></li>
    </ul>
    <p class="fine">El pago único lo lleva directo al pago en gopharmacare.com. Precios en colones, impuestos incluidos. Disponible en Costa Rica.</p>
  </section>`;
}

function unlockBlock(p,pk){
  const done=lead.unlocked;
  return `<section class="unlock" id="unlock" aria-labelledby="un-h">
    <div class="eyebrow">Beneficio exclusivo del quiz</div>
    <h2 id="un-h">${done?"Su beneficio está desbloqueado.":`Desbloquee ${COUPON.pct}% extra en su primer Plan 2+1.`}</h2>
    <p class="sub">${done?"El botón lo lleva al pago con su código ya aplicado.":"Déjenos su correo y le enviamos su recomendación, sus tips de alimentación y su código."}</p>
    <div class="coupon${done?" revealed":" locked"}">${done?"":`<span class="lockic">${ico("lock")}</span>`}
      <div class="pct">${COUPON.pct}%<small> EXTRA</small></div>
      <div class="code" ${done?'id="code"':'aria-hidden="true"'}>${COUPON.code}</div>
    </div>
    ${done?`<div class="copyrow"><a class="btn light" href="${checkoutUrl(pk,"cupon",COUPON.code)}" target="_blank" rel="noopener">Comprar con mi ${COUPON.pct}%<span class="sr"> (se abre en una pestaña nueva)</span></a><button class="copy" type="button" id="copycode">Copiar</button></div>
        <p class="sentto">Le enviamos su recomendación y su código a ${esc(lead.email)}.</p>`
    :`<ul class="gifts"><li>${COUPON.pct}% adicional en su primer Plan Paciente 2+1</li><li>Su recomendación y sus tips de alimentación en su correo</li></ul>
      <form id="uf" class="uform" novalidate>
        <div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" inputmode="email" value="${esc(lead.email)}" placeholder="nombre@correo.com" aria-describedby="e-email"><span class="err" id="e-email" aria-live="polite"></span></div>
        <label class="consent" for="consent"><input type="checkbox" id="consent" aria-describedby="e-consent"><span>Acepto recibir correos de Normalibs<sup>®</sup> con mi recomendación, mi código y novedades del Plan Paciente. Puedo darme de baja cuando quiera.</span></label>
        <span class="err" id="e-consent" aria-live="polite"></span>
        <button class="btn shine" type="submit">Desbloquear mi ${COUPON.pct}%</button>
      </form>`}
  </section>`;
}

function team(k,pk){
  if(!CONFIG.showTeamPanel)return "";
  const p=PRES[pk];
  const tags=[["Para",kid()?"Hijo o hija (Sobres)":"Adulto (Cápsulas)"],["Segmento",SEG[A.q1]],["Momento",labelOf("q4",A.q4)],["Diagnóstico",labelOf("q3",A.q3)],["Síntomas",A.alarm.includes("ninguno")?"Ninguna":A.alarm.map(a=>labelOf("alarm",a)).join(", ")],["Correo",lead.email||"No desbloqueó"]];
  const mt=MOMENT_TIP[A.q4][0].toLowerCase();
  const seq=[
    ["Inmediato · al desbloquear",`Su recomendación: Normalibs® ${p.name} y su ${COUPON.pct}% extra`,`Su recorrido, tips de alimentación para ${FOCUS[A.q1]} y el código ${COUPON.code}.`],
    ["Si no compra · día 1",`${kid()?"La recomendación para su hijo o hija":"Su recomendación"} para ${FOCUS[A.q1]} le está esperando`,`Un tip para ${mt} y el recordatorio del Plan 2+1: 3 meses por el precio de 2.`],
    ["Si no compra · día 3","3 meses de constancia, en un solo plan",`El uso recomendado de Normalibs® es de 3 meses continuos. Empiece con el plan fraccionado: ${fmt(p.fee)} el primer pago.`],
    ["Si no compra · día 7",`Su código ${COUPON.code} vence pronto`,`Último recordatorio: 3 por el precio de 2 y ${COUPON.pct}% extra en su primer plan.`]
  ];
  return `<details class="team"><summary>Vista del equipo · datos de este lead</summary>
    <p>Así llega cada respuesta a la plataforma de email marketing y a Meta como segmento. Este panel no lo ve el usuario final.</p>
    <div class="tags">${tags.map(t=>`<span>${t[0]}: <b>${esc(t[1])}</b></span>`).join("")}</div>
    <p><strong>Secuencia de email marketing</strong> (se activa al desbloquear y se detiene cuando la persona compra):</p>
    ${seq.map(m=>`<div class="mail"><small>${m[0]}</small><b>${esc(m[1])}</b><span>${esc(m[2])}</span></div>`).join("")}
    <p>"Comprar 2+1" abre el pago de Shopify con el producto ya en el carrito y parámetros UTM. El ${COUPON.pct}% y el código son de ejemplo: hay que crearlos en Shopify.</p>
  </details>`;
}

function result(){
  const pk=presKey(),p=PRES[pk],k=kind();
  $("#app").setAttribute("data-pres",pk);
  const doc=kid()?"su pediatra":"su médico";
  const alarmList=A.alarm.filter(x=>x!=="ninguno");
  const note=k==="alarm"
    ?`<div class="mdnote warn">${ico("info")}<p><b>Le recomendamos hablar pronto con ${doc}.</b> Mencionó: ${alarmList.map(a=>esc(labelOf("alarm",a)).toLowerCase()).join(", ")}.</p></div>`
    :k==="nodiag"?`<div class="mdnote">${ico("info")}<p><b>Converse con ${doc}.</b> Solo un profesional de la salud puede confirmar la causa de ${FOCUS[A.q1]}.</p></div>`:"";
  main.innerHTML=`<section class="screen result">
      <div class="rhero"><div class="dish"><img src="${IMG.petri}" alt="" width="720" height="717"><span class="scrim"></span><div class="label"><img src="${IMG.logoW}" alt="Normalibs® Bifidobacterium longum 35624™" width="460" height="85"></div></div></div>
      <div class="rhead">
        <div class="eyebrow">Su resultado</div>
        <h1>${kid()?`La recomendación para su hijo o hija es Normalibs<sup>®</sup> <span class="pn-c">${p.name}</span>.`:`Su recomendación es Normalibs<sup>®</sup> <span class="pn-c">${p.name}</span>.`}</h1>
      </div>
      <div class="rbody">
        ${symBlock()}
        ${routineBlock(p)}
        <div class="sec"><div class="sec-head rv"><div class="eyebrow">${kid()?"Su presentación para niños":"Su presentación"}</div></div>
          <article class="pcard rv"><div class="pimg"><img src="${p.img}" alt="Caja de Normalibs ${p.name}" width="420" height="${pk==="capsulas"?541:517}"></div>
            <div class="pinfo"><span class="ptag">${p.aud}</span><h3>Normalibs<sup>®</sup> <span>${p.name}</span></h3><ul class="specs">${p.specs.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div></article>
        </div>
        ${planBlock(p,pk)}
        ${lead.unlocked?"":unlockBlock(p,pk)}
        ${team(k,pk)}
        <button class="link" type="button" id="restart">Volver a empezar</button>
      </div>
    </section>`;
  track("quiz_complete",{para:kid()?"hijo":"adulto",presentacion:pk,molestia_principal:A.q1,momento:A.q4,diagnostico:A.q3,sintomas:A.alarm.join(","),email:!!lead.email});
  wire(pk);
}
function smooth(){return RM()?"auto":"smooth"}
function wire(pk){
  $("#toUnlock")&&$("#toUnlock").addEventListener("click",()=>{$("#unlock").scrollIntoView({behavior:smooth(),block:"start"});setTimeout(()=>{const e=$("#email");e&&e.focus({preventScroll:true})},450)});
  reveal();
  wireUnlock(pk);
  main.querySelectorAll('a[href*="gopharmacare.com"]').forEach(a=>a.addEventListener("click",()=>track("quiz_checkout_click",{presentacion:pk,url:a.href})));
  $("#restart").addEventListener("click",()=>{Object.keys(A).forEach(k=>delete A[k]);A.alarm=[];lead={email:"",unlocked:false};i=0;render();window.scrollTo(0,0)});
}
function reveal(){
  const els=[...main.querySelectorAll(".rv")];
  if(RM()||!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");o.unobserve(e.target);const b=e.target.querySelector(".price b[data-n]");if(b)countUp(b)}}),{rootMargin:"0px 0px -8% 0px"});
  els.forEach(e=>o.observe(e));obs.push(o);
  setTimeout(()=>els.forEach(e=>e.classList.add("in")),6000);
}
function countUp(b){
  const n=+b.dataset.n,t0=performance.now(),D=900;
  const f=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);b.textContent=fmt(n*e);if(k<1)requestAnimationFrame(f)};
  requestAnimationFrame(f);
}
function burst(host){
  if(RM())return;
  const c=document.createElement("canvas");c.className="fx";host.appendChild(c);
  const r=host.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);c.width=r.width*dpr;c.height=r.height*dpr;
  let g=null;try{g=c.getContext("2d")}catch(e){}if(!g){c.remove();return}g.scale(dpr,dpr);
  const cx=r.width/2,cy=Math.min(r.height*.4,240),cols=["#7EC3CF","#0E8C96","#FFFFFF","#E09A55","#9F8BE8","#F08DB4"];
  const P=Array.from({length:90},()=>{const a=Math.random()*Math.PI*2,v=3+Math.random()*6;return{x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:3+Math.random()*4,c:cols[Math.random()*cols.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.3}});
  const t0=performance.now();
  const f=t=>{const k=(t-t0)/1600;g.clearRect(0,0,r.width,r.height);P.forEach(p=>{p.vy+=.18;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,1-k);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);g.restore()});if(k<1)requestAnimationFrame(f);else c.remove()};
  requestAnimationFrame(f);
}
function wireUnlock(pk){
  const f=$("#uf");
  if(f){
    f.addEventListener("submit",e=>{
      e.preventDefault();
      if(!validLead())return;
      $("#plan").outerHTML=planBlock(PRES[pk],pk);main.querySelectorAll("#plan .rv").forEach(x=>x.classList.add("in"));
      $("#unlock").outerHTML=unlockBlock(PRES[pk],pk);
      const t=main.querySelector(".team");if(t&&CONFIG.showTeamPanel){const open=t.open;t.outerHTML=team(kind(),pk);if(open)main.querySelector(".team").open=true}
      wireUnlock(pk);burst($("#unlock"));
      $("#un-h").setAttribute("tabindex","-1");$("#un-h").focus({preventScroll:true});
    });
  }
  const c=$("#copycode");
  if(c)c.addEventListener("click",()=>{const done=()=>{c.textContent="Copiado"};const sel=()=>{const r=document.createRange();r.selectNodeContents($("#code"));const s=getSelection();s.removeAllRanges();s.addRange(r)};try{navigator.clipboard.writeText(COUPON.code).then(done,sel)}catch(e){sel()}});
}

render();
})();
</script>
